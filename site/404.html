<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fogar</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" />
<style>
  :root { color-scheme: dark; --ground: #14100d; --ink: #efe6da; --ink-2: #c9bba9; --ember: #ff6a2b; }
  @media (prefers-color-scheme: light) { :root { color-scheme: light; --ground: #f3ebdf; --ink: #201812; --ink-2: #4e4034; --ember: #d24a12; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ground); color: var(--ink); font-family: "Source Serif 4", Georgia, serif; font-size: 18px; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: clamp(40px, 8vw, 72px); letter-spacing: -0.03em; line-height: 1; margin: 0 0 14px; }
  h1 em { font-style: normal; color: var(--ember); }
  p { color: var(--ink-2); margin: 0 0 22px; }
  a { color: var(--ink); }
</style>
</head>
<body>
  <div>
    <h1>Nothing here.<br /><em>Nothing left the room, either.</em></h1>
    <p>That page does not exist. The new tab is one click away.</p>
    <a href="/">Back to fogar.ai</a>
  </div>
</body>
</html>
